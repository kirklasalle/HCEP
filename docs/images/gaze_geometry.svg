<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <!-- Background Gradients -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#090d16" />
            <stop offset="100%" stop-color="#030712" />
        </radialGradient>

        <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
        </linearGradient>

        <radialGradient id="eyeball-3d" cx="38%" cy="38%" r="62%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="60%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </radialGradient>

        <!-- Glow Filters -->
        <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Markers -->
        <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
        </marker>
        <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
        </marker>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

        .title {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: 19px;
            font-weight: 700;
            fill: #f8fafc;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            fill: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            fill: #94a3b8;
            font-weight: 500;
        }

        .hud-title {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            fill: #cbd5e1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hud-mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
        }

        .math-tex {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-size: 12.5px;
            fill: #f1f5f9;
        }

        .grid-line {
            stroke: #1e293b;
            stroke-width: 0.8;
            stroke-dasharray: 4 6;
            opacity: 0.6;
        }

        /* Animations */
        @keyframes headYawCycle {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-12deg); }
        }

        @keyframes pupilGazeScan {
            0%, 100% { transform: translate(0px, 0px); }
            33%      { transform: translate(14px, -10px); }
            66%      { transform: translate(-10px, 12px); }
        }

        @keyframes drawGazeRay {
            0%   { stroke-dashoffset: 220; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes pulseMatrix {
            0%, 100% { opacity: 0.7; }
            50%      { opacity: 1; }
        }

        .head-rotate {
            transform-origin: 200px 175px;
            animation: headYawCycle 7s ease-in-out infinite;
        }

        .pupil-scan {
            animation: pupilGazeScan 7s ease-in-out infinite;
        }

        .gaze-ray {
            stroke-dasharray: 8 6;
            animation: drawGazeRay 2.5s linear infinite;
        }

        .matrix-pulse {
            animation: pulseMatrix 3s ease-in-out infinite;
        }
    </style>

    <!-- Outer Frame & Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)" rx="14" stroke="#334155" stroke-width="1.5" />

    <!-- Cyber Background Grid -->
    <g class="grid-layout">
        <line x1="40" y1="55" x2="760" y2="55" class="grid-line" />
        <line x1="40" y1="345" x2="760" y2="345" class="grid-line" />
        <line x1="390" y1="55" x2="390" y2="345" class="grid-line" />
    </g>

    <!-- Header Section -->
    <g transform="translate(30, 36)">
        <circle cx="10" cy="-6" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
        <text x="24" y="-1" class="title">Three-Stage Gaze Triangulation Geometry</text>
        <text x="395" y="-2" class="subtitle">EPnP + LM OPTIMIZATION &amp; 3D SPHERICAL OCULAR SOLVER</text>
        <!-- Version Badge -->
        <rect x="690" y="-16" width="55" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="717" y="-2" class="hud-mono" font-size="10" fill="#38bdf8" text-anchor="middle">v1.6.0</text>
    </g>

    <!-- Left: Stage 1 & 2 - PnP Head Pose & Socket Anchors -->
    <g transform="translate(35, 70)">
        <rect width="335" height="260" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" class="hud-title">Stage 1 &amp; 2: Head Pose &amp; Eye Sockets</text>
        <circle cx="315" cy="18" r="4" fill="#a855f7" filter="url(#glow-purple)" />

        <!-- Camera Focal Point (Origin) -->
        <circle cx="45" cy="140" r="9" fill="#312e81" stroke="#6366f1" stroke-width="1.8" filter="url(#glow-purple)" />
        <circle cx="45" cy="140" r="3.5" fill="#a855f7" />
        <text x="45" y="165" class="hud-mono" font-size="9" fill="#a855f7" text-anchor="middle">Cam (0,0,0)</text>

        <!-- PnP Raycast Lines to Face Features -->
        <g opacity="0.45">
            <line x1="45" y1="140" x2="190" y2="85" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 3" />
            <line x1="45" y1="140" x2="190" y2="140" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 3" />
            <line x1="45" y1="140" x2="190" y2="195" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 3" />
        </g>

        <!-- Head Wireframe Mesh (Rotating via PnP Head-Yaw Animation) -->
        <g class="head-rotate">
            <!-- Cranium Silhouette -->
            <path d="M 155 90 C 155 50, 245 50, 245 90 C 245 170, 235 220, 200 235 C 165 220, 155 170, 155 90 Z" 
                  fill="#090d16" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" />

            <!-- Candide-3 Landmark Wireframe Edges -->
            <path d="M 155 130 Q 200 150 245 130 M 155 170 Q 200 190 245 170 M 200 85 L 200 235" 
                  fill="none" stroke="#334155" stroke-width="1" />

            <!-- Left Socket Anchor (CL) -->
            <circle cx="180" cy="130" r="5" fill="#f43f5e" filter="url(#glow-rose)" />
            <!-- Right Socket Anchor (CR) -->
            <circle cx="220" cy="130" r="5" fill="#f43f5e" filter="url(#glow-rose)" />
            <!-- Inter-ocular Baseline (d) -->
            <line x1="180" y1="130" x2="220" y2="130" stroke="#f43f5e" stroke-width="1.5" />
            <text x="200" y="123" class="hud-mono" font-size="9" fill="#fca5a5" text-anchor="middle">d = 64mm</text>

            <!-- 5-Point Umeyama Landmarks -->
            <circle cx="200" cy="160" r="3" fill="#38bdf8" /> <!-- Nose -->
            <circle cx="188" cy="190" r="3" fill="#38bdf8" /> <!-- Mouth L -->
            <circle cx="212" cy="190" r="3" fill="#38bdf8" /> <!-- Mouth R -->
        </g>

        <!-- Solve Extrinsics Transformation Arc -->
        <path d="M 75 180 Q 120 220 165 195" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />
        <text x="120" y="225" class="hud-mono" font-size="9.5" fill="#c084fc" text-anchor="middle">Solve [R_head | T_head]</text>
    </g>

    <!-- Right: Stage 3 - 3D Spherical Eye-in-Head Parallax Solver -->
    <g transform="translate(395, 70)">
        <rect width="370" height="260" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" class="hud-title">Stage 3: 3D Eye-in-Head Spherical Solver</text>
        <circle cx="350" cy="18" r="4" fill="#10b981" filter="url(#glow-emerald)" />

        <!-- 3D Eyeball Sphere Model -->
        <circle cx="150" cy="130" r="75" fill="url(#eyeball-3d)" stroke="#475569" stroke-width="1.8" />
        <circle cx="150" cy="130" r="73" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

        <!-- Eyeball Center (C_eye) -->
        <circle cx="150" cy="130" r="4" fill="#64748b" />
        <text x="150" y="148" class="math-tex" font-size="11" text-anchor="middle">C<tspan font-size="8" dy="3">eye</tspan></text>

        <!-- Coordinate Axes for Eyeball Socket -->
        <line x1="150" y1="130" x2="150" y2="40" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-rose)" />
        <line x1="150" y1="130" x2="245" y2="130" stroke="#38bdf8" stroke-width="1.5" />
        <text x="158" y="50" class="hud-mono" font-size="9" fill="#f43f5e">Y_socket</text>
        <text x="240" y="142" class="hud-mono" font-size="9" fill="#38bdf8">Z_opt</text>

        <!-- Eyeball Radius R Indicator -->
        <line x1="150" y1="130" x2="97" y2="77" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3" />
        <text x="118" y="100" class="math-tex" fill="#94a3b8">R = 12mm</text>

        <!-- Animated Pupil & Gaze Vector Group -->
        <g class="pupil-scan">
            <!-- Iris Contour -->
            <ellipse cx="215" cy="95" rx="12" ry="20" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" transform="rotate(22, 215, 95)" />
            <!-- Pupil Aperture -->
            <ellipse cx="215" cy="95" rx="5.5" ry="10" fill="#020617" transform="rotate(22, 215, 95)" />
            <circle cx="217" cy="93" r="1.5" fill="#ffffff" />

            <!-- Pupil Displacement Vector v -->
            <line x1="205" y1="130" x2="215" y2="95" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)" filter="url(#glow-amber)" />
            <text x="218" y="120" class="hud-mono" font-size="10" fill="#fbbf24" font-weight="bold">v</text>

            <!-- Gaze Vector g_opt Emanating into 3D Space -->
            <line x1="215" y1="95" x2="310" y2="55" stroke="#10b981" stroke-width="2.5" class="gaze-ray" filter="url(#glow-emerald)" marker-end="url(#arrow-emerald)" />
            <text x="280" y="65" class="hud-mono" font-size="11" fill="#34d399" font-weight="bold">g_opt</text>
        </g>
    </g>

    <!-- Bottom Mathematical Framework Footer -->
    <g transform="translate(30, 350)">
        <rect width="740" height="85" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />

        <!-- Left Equation: Head Extrinsics & Umeyama Landmark Transformation -->
        <g transform="translate(20, 20)">
            <text class="hud-title" fill="#a855f7">1. Head Extrinsics (EPnP + Levenberg-Marquardt)</text>
            <text class="math-tex" x="0" y="24">
                P<tspan font-size="9" dy="2">cam</tspan><tspan font-size="12.5" dy="-2"> = </tspan><tspan fill="#a855f7" font-weight="bold">R</tspan><tspan font-size="9" dy="2">head</tspan><tspan font-size="12.5" dy="-2"> · P</tspan><tspan font-size="9" dy="2">mesh</tspan><tspan font-size="12.5" dy="-2"> + </tspan><tspan fill="#a855f7" font-weight="bold">T</tspan><tspan font-size="9" dy="2">head</tspan>
                <tspan font-style="normal" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8" dx="15"> (Umeyama 5-point affine alignment)</tspan>
            </text>
            <text class="hud-mono" x="0" y="44" font-size="10" fill="#c084fc">Re-projection residual: ε &lt; 0.42 px | Convergence: 4 iterations</text>
        </g>

        <!-- Right Equation: Spherical Gaze Ray & World Co-Registration -->
        <g transform="translate(390, 20)">
            <text class="hud-title" fill="#10b981">2. World Gaze Vector (Parallax Co-Registered)</text>
            <text class="math-tex" x="0" y="24">
                <tspan fill="#10b981" font-weight="bold">G</tspan><tspan font-size="9" dy="2">world</tspan><tspan font-size="12.5" dy="-2"> = </tspan><tspan fill="#a855f7" font-weight="bold">R</tspan><tspan font-size="9" dy="2">head</tspan><tspan font-size="12.5" dy="-2"> · [ v</tspan><tspan font-size="9" dy="2">x</tspan><tspan font-size="12.5" dy="-2">, v</tspan><tspan font-size="9" dy="2">y</tspan><tspan font-size="12.5" dy="-2">, √(R² - |v|²) ]</tspan><tspan font-size="9" dy="-5">T</tspan><tspan font-size="12.5"> + </tspan><tspan fill="#a855f7" font-weight="bold">T</tspan><tspan font-size="9" dy="2">head</tspan>
            </text>
            <text class="hud-mono" x="0" y="44" font-size="10" fill="#34d399">True Gaze™ Angular Precision: Δθ &lt; 0.28° | Latency: 5.5 ms</text>
        </g>
    </g>
</svg>
