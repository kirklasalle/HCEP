<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <!-- Background Gradients -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#090d16" />
            <stop offset="100%" stop-color="#030712" />
        </radialGradient>

        <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
        </linearGradient>

        <!-- Eye Cone Volumetric Beam Gradients -->
        <linearGradient id="beam-left-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

        .title {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: 19px;
            font-weight: 700;
            fill: #f8fafc;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            fill: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            fill: #94a3b8;
            font-weight: 500;
        }

        .hud-title {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            fill: #cbd5e1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hud-mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
        }

        .grid-line {
            stroke: #1e293b;
            stroke-width: 0.8;
            stroke-dasharray: 4 6;
            opacity: 0.6;
        }

        /* 5-Phase Mode Cycle Animation: 15s Total (3s per mode) */
        /* 0-20%: LOGIC, 20-40%: SPIRIT, 40-60%: AFFECT, 60-80%: HEART, 80-100%: THINK */
        @keyframes reticleMove {
            0%, 18%   { transform: translate(520px, 115px); } /* 1. LOGIC: Forehead */
            20%, 38%  { transform: translate(520px, 165px); } /* 2. SPIRIT: Eyes */
            40%, 58%  { transform: translate(520px, 215px); } /* 3. AFFECT: Social Triangle */
            60%, 78%  { transform: translate(520px, 265px); } /* 4. HEART: Lower Face */
            80%, 98%  { transform: translate(665px, 95px); }  /* 5. THINK: Averted */
            100%      { transform: translate(520px, 115px); }
        }

        @keyframes leftPupil {
            0%, 18%   { transform: translate(146px, 172px); } /* Logic: Up-center */
            20%, 38%  { transform: translate(148px, 178px); } /* Spirit: Direct center */
            40%, 58%  { transform: translate(148px, 183px); } /* Affect: Down-center */
            60%, 78%  { transform: translate(148px, 188px); } /* Heart: Down-lower */
            80%, 98%  { transform: translate(155px, 168px); } /* Think: Up-Right */
            100%      { transform: translate(146px, 172px); }
        }

        @keyframes rightPupil {
            0%, 18%   { transform: translate(242px, 172px); }
            20%, 38%  { transform: translate(244px, 178px); }
            40%, 58%  { transform: translate(244px, 183px); }
            60%, 78%  { transform: translate(244px, 188px); }
            80%, 98%  { transform: translate(251px, 168px); }
            100%      { transform: translate(242px, 172px); }
        }

        /* Mode Highlighting */
        @keyframes hlLogic {
            0%, 18%, 100% { fill: #3b82f6; fill-opacity: 0.35; stroke: #60a5fa; stroke-width: 1.5; }
            20%, 98%      { fill: #0f172a; fill-opacity: 0.2; stroke: #334155; stroke-width: 1; }
        }
        @keyframes hlSpirit {
            20%, 38%      { fill: #10b981; fill-opacity: 0.35; stroke: #34d399; stroke-width: 1.5; }
            0%, 18%, 40%, 100% { fill: #0f172a; fill-opacity: 0.2; stroke: #334155; stroke-width: 1; }
        }
        @keyframes hlAffect {
            40%, 58%      { fill: #ec4899; fill-opacity: 0.35; stroke: #f472b6; stroke-width: 1.5; }
            0%, 38%, 60%, 100% { fill: #0f172a; fill-opacity: 0.2; stroke: #334155; stroke-width: 1; }
        }
        @keyframes hlHeart {
            60%, 78%      { fill: #a855f7; fill-opacity: 0.35; stroke: #c084fc; stroke-width: 1.5; }
            0%, 58%, 80%, 100% { fill: #0f172a; fill-opacity: 0.2; stroke: #334155; stroke-width: 1; }
        }
        @keyframes hlThink {
            80%, 98%      { fill: #f59e0b; fill-opacity: 0.35; stroke: #fbbf24; stroke-width: 1.5; }
            0%, 78%, 100% { fill: #0f172a; fill-opacity: 0.2; stroke: #334155; stroke-width: 1; }
        }

        /* Footer Telemetry Switchers */
        @keyframes showLogic  { 0%, 18%, 100% { opacity: 1; } 20%, 98% { opacity: 0; } }
        @keyframes showSpirit { 20%, 38% { opacity: 1; } 0%, 18%, 40%, 100% { opacity: 0; } }
        @keyframes showAffect { 40%, 58% { opacity: 1; } 0%, 38%, 60%, 100% { opacity: 0; } }
        @keyframes showHeart  { 60%, 78% { opacity: 1; } 0%, 58%, 80%, 100% { opacity: 0; } }
        @keyframes showThink  { 80%, 98% { opacity: 1; } 0%, 78%, 100% { opacity: 0; } }

        .reticle-group { animation: reticleMove 15s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .pupil-l { animation: leftPupil 15s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .pupil-r { animation: rightPupil 15s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

        .cell-1-logic  { animation: hlLogic 15s infinite; }
        .cell-2-spirit { animation: hlSpirit 15s infinite; }
        .cell-3-affect { animation: hlAffect 15s infinite; }
        .cell-4-heart  { animation: hlHeart 15s infinite; }
        .cell-5-think  { animation: hlThink 15s infinite; }

        .info-1-logic  { animation: showLogic 15s infinite; }
        .info-2-spirit { animation: showSpirit 15s infinite; }
        .info-3-affect { animation: showAffect 15s infinite; }
        .info-4-heart  { animation: showHeart 15s infinite; }
        .info-5-think  { animation: showThink 15s infinite; }
    </style>

    <!-- Outer Frame & Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)" rx="14" stroke="#334155" stroke-width="1.5" />

    <!-- Cyber Background Grid -->
    <g class="grid-layout">
        <line x1="40" y1="55" x2="760" y2="55" class="grid-line" />
        <line x1="40" y1="345" x2="760" y2="345" class="grid-line" />
        <line x1="375" y1="55" x2="375" y2="345" class="grid-line" />
    </g>

    <!-- Header Section -->
    <g transform="translate(30, 36)">
        <circle cx="10" cy="-6" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
        <text x="24" y="-1" class="title">Cones of Vision &amp; 13 Gaze Regions</text>
        <text x="360" y="-2" class="subtitle">5-MODE COGNITIVE-EMOTIONAL HCEP CLASSIFIER &amp; TELEMETRY MATRIX</text>
        <!-- Version Badge -->
        <rect x="690" y="-16" width="55" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="717" y="-2" class="hud-mono" font-size="10" fill="#38bdf8" text-anchor="middle">v1.6.0</text>
    </g>

    <!-- Left: Ocular Telemetry Sensor Rig & Pupil Tracking -->
    <g transform="translate(35, 70)">
        <rect width="320" height="260" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" class="hud-title">Binocular Eye-Tracking Rig</text>
        <circle cx="300" cy="18" r="4" fill="#38bdf8" filter="url(#glow-cyan)" />

        <!-- Stylized Head Silhouette -->
        <path d="M 65 140 C 65 80, 255 80, 255 140 C 255 200, 235 235, 160 250 C 85 235, 65 200, 65 140 Z" 
              fill="#090d16" stroke="#334155" stroke-width="1.5" />

        <!-- Left Sclera & Iris -->
        <ellipse cx="120" cy="138" rx="30" ry="17" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
        <ellipse cx="120" cy="138" rx="28" ry="15" fill="none" stroke="#1e293b" stroke-dasharray="2 2" />

        <!-- Right Sclera & Iris -->
        <ellipse cx="200" cy="138" rx="30" ry="17" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
        <ellipse cx="200" cy="138" rx="28" ry="15" fill="none" stroke="#1e293b" stroke-dasharray="2 2" />

        <!-- Animated Left Pupil -->
        <g class="pupil-l">
            <circle cx="0" cy="-40" r="9" fill="#0284c7" filter="url(#glow-cyan)" />
            <circle cx="0" cy="-40" r="4.5" fill="#020617" />
            <circle cx="2.5" cy="-42.5" r="2" fill="#ffffff" />
        </g>

        <!-- Animated Right Pupil -->
        <g class="pupil-r">
            <circle cx="-42" cy="-40" r="9" fill="#0284c7" filter="url(#glow-cyan)" />
            <circle cx="-42" cy="-40" r="4.5" fill="#020617" />
            <circle cx="-39.5" cy="-42.5" r="2" fill="#ffffff" />
        </g>

        <!-- Eyelid Contours -->
        <path d="M 90 138 Q 120 118 150 138" fill="none" stroke="#64748b" stroke-width="1.5" />
        <path d="M 90 138 Q 120 158 150 138" fill="none" stroke="#64748b" stroke-width="1.5" />
        <path d="M 170 138 Q 200 118 230 138" fill="none" stroke="#64748b" stroke-width="1.5" />
        <path d="M 170 138 Q 200 158 230 138" fill="none" stroke="#64748b" stroke-width="1.5" />

        <!-- Inter-Ocular Distance (IOD) Indicator -->
        <line x1="120" y1="175" x2="200" y2="175" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" />
        <circle cx="120" cy="175" r="2" fill="#38bdf8" />
        <circle cx="200" cy="175" r="2" fill="#38bdf8" />
        <text x="160" y="190" class="hud-mono" font-size="9" fill="#38bdf8" text-anchor="middle">IOD = 64.0 mm</text>
    </g>

    <!-- Right: 13-Region Gaze Target Matrix & 5-Mode Zones -->
    <g transform="translate(390, 70)">
        <rect width="375" height="260" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" class="hud-title">13-Region Spatial Target Plane</text>

        <!-- 1. Forehead Zone (LOGIC) -->
        <rect x="20" y="36" width="250" height="42" rx="5" class="cell-1-logic" />
        <text x="145" y="61" class="hud-title" font-size="10" fill="#93c5fd" text-anchor="middle">1. FOREHEAD (LOGIC / ANALYTICAL)</text>

        <!-- 2. Eye Contact Zone (SPIRIT) -->
        <rect x="20" y="84" width="250" height="42" rx="5" class="cell-2-spirit" />
        <text x="145" y="109" class="hud-title" font-size="10" fill="#a7f3d0" text-anchor="middle">2. MUTUAL EYES (SPIRIT / AUTHENTIC)</text>

        <!-- 3. Social Triangle Zone (AFFECT) -->
        <rect x="20" y="132" width="250" height="42" rx="5" class="cell-3-affect" />
        <text x="145" y="157" class="hud-title" font-size="10" fill="#fbcfe8" text-anchor="middle">3. SOCIAL TRIANGLE (AFFECT / ENGAGED)</text>

        <!-- 4. Lower Face Zone (HEART) -->
        <rect x="20" y="180" width="250" height="42" rx="5" class="cell-4-heart" />
        <text x="145" y="205" class="hud-title" font-size="10" fill="#e9d5ff" text-anchor="middle">4. LOWER FACE / MOUTH (HEART / EMPATHY)</text>

        <!-- 5. Lateral Think Quadrant (THINK - Aversion) -->
        <rect x="280" y="20" width="75" height="58" rx="5" class="cell-5-think" />
        <text x="317" y="46" class="hud-title" font-size="9" fill="#fef08a" text-anchor="middle">5. THINK</text>
        <text x="317" y="60" class="hud-mono" font-size="8" fill="#fde047" text-anchor="middle">&gt;15° AVERT</text>

        <!-- Gaze Reticle (Dynamic Animated Crosshair) -->
        <g class="reticle-group" transform="translate(0, 0)">
            <circle cx="-380" cy="-55" r="11" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
            <circle cx="-380" cy="-55" r="2.5" fill="#38bdf8" />
            <line x1="-395" y1="-55" x2="-365" y2="-55" stroke="#38bdf8" stroke-width="1.5" />
            <line x1="-380" y1="-70" x2="-380" y2="-40" stroke="#38bdf8" stroke-width="1.5" />
        </g>
    </g>

    <!-- Bottom: Dynamic 5-Mode Telemetry & AI Response Style Card -->
    <g transform="translate(30, 350)">
        <rect width="740" height="85" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />

        <!-- 1. LOGIC TELEMETRY -->
        <g class="info-1-logic" transform="translate(20, 20)">
            <text class="hud-title" fill="#3b82f6" font-size="13">ACTIVE HCEP MODE: LOGIC (63% CONFIDENCE)</text>
            <text class="label" x="0" y="20" fill="#cbd5e1">Gaze localized on Forehead plane. High cognitive load &amp; structured information processing.</text>
            <text x="0" y="40" class="hud-mono" fill="#60a5fa">AU3 Furrow: 0.42 | Saccades: 1.2 Hz (Stable) | Target: Region #1 Forehead</text>

            <rect x="520" y="-8" width="185" height="52" rx="5" fill="#1e3a8a" fill-opacity="0.45" stroke="#3b82f6" stroke-width="1" />
            <text x="612" y="12" class="hud-title" font-size="9" fill="#93c5fd" text-anchor="middle">LLM RESPONSE HARNESS</text>
            <text x="612" y="32" class="hud-title" font-size="12" fill="#ffffff" text-anchor="middle">FACTUAL &amp; PRECISE</text>
        </g>

        <!-- 2. SPIRIT TELEMETRY -->
        <g class="info-2-spirit" transform="translate(20, 20)">
            <text class="hud-title" fill="#10b981" font-size="13">ACTIVE HCEP MODE: SPIRIT (94% CONFIDENCE)</text>
            <text class="label" x="0" y="20" fill="#cbd5e1">Direct mutual eye contact lock. High authentic interpersonal rapport &amp; deep engagement.</text>
            <text x="0" y="40" class="hud-mono" fill="#34d399">Mutual Contact: 98.4% | Alignment Vector: [0.02, -0.01, 1.00] | Target: Region #2 Eyes</text>

            <rect x="520" y="-8" width="185" height="52" rx="5" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="1" />
            <text x="612" y="12" class="hud-title" font-size="9" fill="#a7f3d0" text-anchor="middle">LLM RESPONSE HARNESS</text>
            <text x="612" y="32" class="hud-title" font-size="12" fill="#ffffff" text-anchor="middle">AUTHENTIC &amp; DIRECT</text>
        </g>

        <!-- 3. AFFECT TELEMETRY -->
        <g class="info-3-affect" transform="translate(20, 20)">
            <text class="hud-title" fill="#ec4899" font-size="13">ACTIVE HCEP MODE: AFFECT (88% CONFIDENCE)</text>
            <text class="label" x="0" y="20" fill="#cbd5e1">Gaze scanning Social Triangle (eyes to mouth). Emotional reciprocity &amp; positive valence.</text>
            <text x="0" y="40" class="hud-mono" fill="#f472b6">Triangle Rate: 0.85 Hz | Valence: +0.72 | AU12 Smile: 0.65 | Target: Region #5 Nose/Lip</text>

            <rect x="520" y="-8" width="185" height="52" rx="5" fill="#701a75" fill-opacity="0.45" stroke="#ec4899" stroke-width="1" />
            <text x="612" y="12" class="hud-title" font-size="9" fill="#fbcfe8" text-anchor="middle">LLM RESPONSE HARNESS</text>
            <text x="612" y="32" class="hud-title" font-size="12" fill="#ffffff" text-anchor="middle">WARM &amp; EMPATHETIC</text>
        </g>

        <!-- 4. HEART TELEMETRY -->
        <g class="info-4-heart" transform="translate(20, 20)">
            <text class="hud-title" fill="#a855f7" font-size="13">ACTIVE HCEP MODE: HEART (82% CONFIDENCE)</text>
            <text class="label" x="0" y="20" fill="#cbd5e1">Gaze anchored to lower face with empathic markers. Deep supportive and caring resonance.</text>
            <text x="0" y="40" class="hud-mono" fill="#c084fc">Empathy Index: High | AU4/AU15 Markers | Target: Region #8 Mouth/Chin</text>

            <rect x="520" y="-8" width="185" height="52" rx="5" fill="#581c87" fill-opacity="0.45" stroke="#a855f7" stroke-width="1" />
            <text x="612" y="12" class="hud-title" font-size="9" fill="#e9d5ff" text-anchor="middle">LLM RESPONSE HARNESS</text>
            <text x="612" y="32" class="hud-title" font-size="12" fill="#ffffff" text-anchor="middle">VALIDATING &amp; CARING</text>
        </g>

        <!-- 5. THINK TELEMETRY -->
        <g class="info-5-think" transform="translate(20, 20)">
            <text class="hud-title" fill="#f59e0b" font-size="13">ACTIVE HCEP MODE: THINK (91% CONFIDENCE)</text>
            <text class="label" x="0" y="20" fill="#cbd5e1">Gaze averted &gt;15° off-axis. Internal recall, synthesis &amp; silent cognitive reflection.</text>
            <text x="0" y="40" class="hud-mono" fill="#fbbf24">Aversion Angle: 22.4° | Silence Protocol: ACTIVE | Target: Region #11 Lateral Quadrant</text>

            <rect x="520" y="-8" width="185" height="52" rx="5" fill="#78350f" fill-opacity="0.45" stroke="#f59e0b" stroke-width="1" />
            <text x="612" y="12" class="hud-title" font-size="9" fill="#fef08a" text-anchor="middle">LLM RESPONSE HARNESS</text>
            <text x="612" y="32" class="hud-title" font-size="12" fill="#ffffff" text-anchor="middle">BRIEF / NON-INTRUSIVE</text>
        </g>
    </g>
</svg>
