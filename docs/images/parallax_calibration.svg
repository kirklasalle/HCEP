<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <!-- Background Gradients -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#090d16" />
            <stop offset="100%" stop-color="#030712" />
        </radialGradient>

        <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
        </linearGradient>

        <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
        </linearGradient>

        <linearGradient id="truegaze-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Markers -->
        <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
        </marker>
        <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
        </marker>
        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
    </defs>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

        .title {
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
            font-size: 19px;
            font-weight: 700;
            fill: #f8fafc;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11px;
            fill: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            fill: #94a3b8;
            font-weight: 500;
        }

        .hud-title {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            fill: #cbd5e1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hud-mono {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 11px;
            font-weight: 600;
        }

        .grid-line {
            stroke: #1e293b;
            stroke-width: 0.8;
            stroke-dasharray: 4 6;
            opacity: 0.6;
        }

        /* Animated Elements */
        @keyframes drawPulse {
            0%, 100% { stroke-dashoffset: 0; opacity: 0.95; }
            50% { stroke-dashoffset: 30; opacity: 0.75; }
        }

        @keyframes stateSwitchA {
            0%, 46% { opacity: 1; pointer-events: auto; }
            52%, 96% { opacity: 0; pointer-events: none; }
            100% { opacity: 1; }
        }

        @keyframes stateSwitchB {
            0%, 46% { opacity: 0; pointer-events: none; }
            52%, 96% { opacity: 1; pointer-events: auto; }
            100% { opacity: 0; }
        }

        @keyframes radarSweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGazePoint {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.35); opacity: 1; }
        }

        @keyframes photonFlow {
            0% { stroke-dashoffset: 120; }
            100% { stroke-dashoffset: 0; }
        }

        .state-raw {
            animation: stateSwitchA 9s ease-in-out infinite;
        }

        .state-calibrated {
            animation: stateSwitchB 9s ease-in-out infinite;
        }

        .photon-stream {
            stroke-dasharray: 6 10;
            animation: photonFlow 2s linear infinite;
        }

        .reticle-ping {
            transform-origin: center;
            animation: pulseGazePoint 1.8s ease-in-out infinite;
        }
    </style>

    <!-- Outer Frame & Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)" rx="14" stroke="#334155" stroke-width="1.5" />

    <!-- Cyber Background Grid -->
    <g class="grid-layout">
        <line x1="40" y1="55" x2="760" y2="55" class="grid-line" />
        <line x1="40" y1="365" x2="760" y2="365" class="grid-line" />
        <line x1="280" y1="55" x2="280" y2="365" class="grid-line" />
        <line x1="510" y1="55" x2="510" y2="365" class="grid-line" />
    </g>

    <!-- Header Section -->
    <g transform="translate(30, 36)">
        <circle cx="10" cy="-6" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
        <text x="24" y="-1" class="title">True Gaze™ 3D Parallax Calibration</text>
        <text x="350" y="-2" class="subtitle">SPATIAL CO-REGISTRATION &amp; CAMERA OFF-AXIS RECOVERY</text>
        <!-- Version Badge -->
        <rect x="690" y="-16" width="55" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="717" y="-2" class="hud-mono" font-size="10" fill="#38bdf8" text-anchor="middle">v1.6.0</text>
    </g>

    <!-- HUD Telemetry Card (Top Right) -->
    <g transform="translate(525, 70)">
        <rect width="245" height="85" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
        
        <text x="14" y="22" class="hud-title">Sensor Kinematics</text>
        <circle cx="230" cy="18" r="4" fill="#10b981" filter="url(#glow-emerald)" />

        <text x="14" y="44" class="label">Head Offset (Tz):</text>
        <text x="140" y="44" class="hud-mono" fill="#38bdf8">1.482 m (LM Opt)</text>

        <text x="14" y="62" class="label">Optical Pitch (θx):</text>
        <text x="140" y="62" class="hud-mono" fill="#a78bfa">+18.54° Off-Axis</text>

        <text x="14" y="78" class="label">Active Solver:</text>
        <g class="state-raw">
            <text x="140" y="78" class="hud-mono" fill="#f43f5e">RAW_OPTICAL (SKEW)</text>
        </g>
        <g class="state-calibrated">
            <text x="140" y="78" class="hud-mono" fill="#10b981">TRUE_GAZE (LOCKED)</text>
        </g>
    </g>

    <!-- Left: Profile Observer / Eye Socket Model -->
    <g transform="translate(40, 75)">
        <!-- Silhouette Card Backdrop -->
        <rect width="220" height="275" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" class="hud-title">Observer 3D Anchor (Ceye)</text>

        <!-- User Profile Geometry -->
        <path d="M 50 250 C 55 210, 75 180, 85 155 C 80 145, 75 130, 75 110 C 75 80, 95 55, 125 55 C 155 55, 175 75, 175 105 C 175 125, 170 140, 160 150 C 168 165, 180 195, 185 250 Z" 
              fill="#090d16" stroke="#475569" stroke-width="1.8" />

        <!-- 3D Eyeball Sphere & Socket Center -->
        <circle cx="152" cy="108" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
        <circle cx="152" cy="108" r="13" fill="none" stroke="#1e293b" stroke-dasharray="3 3" />
        <circle cx="152" cy="108" r="3.5" fill="#38bdf8" />
        <text x="152" y="132" class="hud-mono" font-size="9" fill="#38bdf8" text-anchor="middle">Ceye [x,y,z]</text>

        <!-- Dynamic Pupil Reticle -->
        <circle cx="159" cy="108" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2" class="reticle-ping" />
        <circle cx="160" cy="107" r="1.5" fill="#ffffff" />

        <!-- Coordinate System Axis at Eye Center -->
        <line x1="152" y1="108" x2="152" y2="70" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-rose)" />
        <line x1="152" y1="108" x2="195" y2="108" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
        <text x="145" y="66" class="hud-mono" font-size="9" fill="#f43f5e">Yh</text>
        <text x="200" y="111" class="hud-mono" font-size="9" fill="#10b981">Zh</text>

        <text x="110" y="260" class="label" font-size="10" text-anchor="middle" fill="#64748b">Pupil Gaze Origin (PnP)</text>
    </g>

    <!-- Center Scene: Optical Ray Tracing & Target Co-Registration -->
    <!-- Observer Pupil Center: (199, 183) -->
    <!-- Off-Axis Sensor Center: (640, 195) Mounted at (640, 195 - monitor offset) -->
    <!-- Monitor Display Screen Plane at x = 650 -->

    <!-- Sensor Optical Reference Line -->
    <line x1="640" y1="195" x2="199" y2="183" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4" />
    <text x="410" y="175" class="label" font-size="9.5" fill="#818cf8" transform="rotate(1.8, 410, 175)">Sensor Optical Frustum Vector (θ = 18.5°)</text>

    <!-- STATE 1: UNCORRECTED RAW PARALLAX (Red / Rose) -->
    <g class="state-raw">
        <!-- Ray from eye to skewed screen point (downward offset) -->
        <line x1="199" y1="183" x2="650" y2="295" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" class="photon-stream" filter="url(#glow-rose)" marker-end="url(#arrow-rose)" />
        
        <!-- Impact Reticle on Screen -->
        <circle cx="650" cy="295" r="7" fill="none" stroke="#f43f5e" stroke-width="2" class="reticle-ping" filter="url(#glow-rose)" />
        <circle cx="650" cy="295" r="2" fill="#f43f5e" />

        <!-- Skew Indicator Dimension -->
        <line x1="662" y1="210" x2="662" y2="295" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="2 2" />
        <line x1="658" y1="210" x2="666" y2="210" stroke="#f43f5e" stroke-width="1" />
        <line x1="658" y1="295" x2="666" y2="295" stroke="#f43f5e" stroke-width="1" />
        <text x="672" y="256" class="hud-mono" font-size="10" fill="#f43f5e">ΔY = 12.4 cm</text>
    </g>

    <!-- STATE 2: CALIBRATED TRUE GAZE™ VECTOR (Emerald / Teal) -->
    <g class="state-calibrated">
        <!-- True Gaze Vector straight to Avatar Eye Contact Anchor -->
        <line x1="199" y1="183" x2="650" y2="210" stroke="#10b981" stroke-width="3" class="photon-stream" filter="url(#glow-emerald)" marker-end="url(#arrow-emerald)" />

        <!-- Snapped Target Reticle -->
        <circle cx="650" cy="210" r="8" fill="none" stroke="#10b981" stroke-width="2" class="reticle-ping" filter="url(#glow-emerald)" />
        <circle cx="650" cy="210" r="2.5" fill="#34d399" />
        <circle cx="650" cy="210" r="14" fill="none" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7" />

        <!-- Callout Banner -->
        <path d="M 645 200 L 580 170 L 460 170" fill="none" stroke="#10b981" stroke-width="1.2" />
        <text x="450" y="165" class="hud-mono" font-size="10" fill="#34d399" text-anchor="end">True Gaze™ Co-Registered Focal Line (Error &lt; 0.28°)</text>
    </g>

    <!-- Right: Hardware Monitor & Off-Axis Sensor Rig -->
    <g transform="translate(640, 160)">
        <!-- Top Mounted Off-Axis Sensor (Kinect / Webcam) -->
        <rect x="0" y="0" width="22" height="22" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="11" cy="11" r="5" fill="#312e81" stroke="#38bdf8" stroke-width="1" />
        <circle cx="11" cy="11" r="2" fill="#38bdf8" />
        <text x="-8" y="-6" class="label" font-size="9.5" text-anchor="end" fill="#818cf8">Off-Axis Sensor (Top Bezel)</text>

        <!-- Monitor Bezel Frame -->
        <rect x="8" y="26" width="10" height="150" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <rect x="6" y="32" width="3" height="138" fill="#38bdf8" fill-opacity="0.3" />

        <!-- Monitor Stand Base -->
        <path d="M 0 176 L 26 176 L 32 190 L -6 190 Z" fill="#0f172a" stroke="#475569" stroke-width="1.2" />

        <!-- Avatar Window Target Point on Monitor (y = 50 relative to monitor = y:210 global) -->
        <circle cx="7" cy="50" r="4" fill="#38bdf8" filter="url(#glow-cyan)" />
        <text x="-10" y="54" class="hud-mono" font-size="9" fill="#38bdf8" text-anchor="end">Avatar Face Focal Point</text>
    </g>

    <!-- Bottom Matrix & Explanation Footer -->
    <g transform="translate(30, 360)">
        <!-- Left Footer Card: Problem / Solution Description -->
        <rect width="470" height="75" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />

        <g class="state-raw" transform="translate(18, 22)">
            <text class="hud-title" fill="#f43f5e">PARALLAX ERROR: PERSPECTIVE MISALIGNMENT</text>
            <text class="label" x="0" y="18" fill="#cbd5e1">Top-mounted sensors capture gaze from an elevated angle, creating false "downward look" errors.</text>
            <text class="label" x="0" y="34" fill="#94a3b8">The virtual avatar registers human focus as disengaged or looking at the keyboard/desk.</text>
        </g>

        <g class="state-calibrated" transform="translate(18, 22)">
            <text class="hud-title" fill="#10b981">TRUE GAZE™: 3D PROJECTION MATRIX TRANSFORMATION</text>
            <text class="label" x="0" y="18" fill="#cbd5e1">HCEP translates raw eye vectors via virtual camera space relative to the active avatar screen window.</text>
            <text class="label" x="0" y="34" fill="#94a3b8">Recovers true ocular alignment with sub-millimeter precision for biological eye contact authenticity.</text>
        </g>

        <!-- Right Footer Card: Dynamic Calibration State Badge -->
        <g transform="translate(485, 0)">
            <rect width="255" height="75" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
            <text x="127" y="24" class="hud-title" text-anchor="middle" fill="#94a3b8">REAL-TIME CO-REGISTRATION STATUS</text>

            <g class="state-raw">
                <rect x="20" y="36" width="215" height="26" rx="5" fill="#881337" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1" />
                <text x="127" y="53" class="hud-mono" font-size="11" fill="#fca5a5" font-weight="bold" text-anchor="middle">❌ SKEWED (OFFSET: 12.4cm)</text>
            </g>

            <g class="state-calibrated">
                <rect x="20" y="36" width="215" height="26" rx="5" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="1" />
                <text x="127" y="53" class="hud-mono" font-size="11" fill="#6ee7b7" font-weight="bold" text-anchor="middle">✔ CALIBRATED (RESIDUAL: 0.28cm)</text>
            </g>
        </g>
    </g>
</svg>
